<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$name</title>
  <meta name="author" content="$name">
  <meta name="description" content="$tagline_text">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$name">
  <meta property="og:description" content="$tagline_text">
  <meta property="og:url" content="$site_url/">
  <meta property="og:image" content="$site_url/assets/img/social-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="$name: $tagline_text">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/fonts/lato/lato-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/lato/lato-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/lato/lato-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
  <main class="page">
    <table class="header"><tbody>
      <tr>
        <td class="intro">
          <p class="name">$name</p>
          <p class="tagline">$tagline</p>
          <p>$bio</p>
          <p class="links">$links</p>
        </td>
        <td class="photo"><img src="$photo" alt="Photo of $name"></td>
      </tr>
    </tbody></table>

    <h2>Research</h2>
    <table class="papers" id="research"><tbody>
$rows
    </tbody></table>

    <h2>Other publications</h2>
    <table class="papers" id="other-publications"><tbody>
$others
    </tbody></table>

    <p class="footer">
      Website design adapted from <a href="https://github.com/jonbarron/jonbarron.github.io">Jon Barron's website</a>.
      Movies and figures are from, or adapted from, the papers credited on each paper's page or linked from each row.
    </p>
  </main>
</body>
</html>
