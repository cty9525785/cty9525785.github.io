# Drafted from Tianyu’s academic CV and confirmed by Tianyu; split into two paragraphs and reworded with Tianyu
# (2026-10-30). [label](https://...) makes a link, and a blank line starts a new paragraph.
bio = """
At the Bristol Robotics Laboratory, University of Bristol, I work in the [VIVO Hub for Enhanced Independent Living](https://www.thevivohub.com/) on electrostatic actuators, a lightweight replacement for the bulky motors and pneumatic systems in exosuits.

Previously, I did my PhD at Nanyang Technological University in Prof. Yifan Wang’s [Robotic Materials Group](https://www.yifanwangntu.com/), where I developed a scale-inspired layered structure whose inversely designed surface patterns let it morph into a target shape and change its stiffness at the same time. From it, I built an amphibious robot and a drone landing gear. Before that, I used finite element models to study how thin films and nanostructured metals deform."""
